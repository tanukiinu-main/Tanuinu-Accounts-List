<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VRChat アカウントステータス</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#121d2e; --card:#1a293d; --line:#2b3c55; --text:#eef5ff; --muted:#9fb0c7; --accent:#62b5ff; --green:#35c47a; --red:#ff6374; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px 88px; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif; color:var(--text); background:radial-gradient(circle at top,#1b3858 0,#0b1220 42%,#070b13 100%); }
    .container { width:min(920px,100%); margin:auto; padding:28px; background:rgba(18,29,46,.94); border:1px solid rgba(130,170,220,.18); border-radius:20px; box-shadow:0 24px 70px #0008; }
    .header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; }
    h1 { margin:0 0 8px; font-size:clamp(1.45rem,4vw,2rem); letter-spacing:.02em; }
    .subtitle { margin:0; color:var(--muted); font-size:.9rem; }
    .admin-header-btn { border:1px solid var(--line); border-radius:10px; padding:9px 13px; color:var(--muted); background:#172437; cursor:pointer; transition:.2s; white-space:nowrap; }
    .admin-header-btn:hover { color:var(--text); border-color:var(--accent); }
    .admin-header-btn.active { color:#fff; background:#8f2638; border-color:#ff6374; }
    .admin-banner { display:none; margin:0 0 18px; padding:11px 14px; border-radius:10px; background:#702235; border:1px solid #bd405a; color:#ffdce2; font-size:.88rem; }
    .auth-box { display:flex; gap:10px; margin-bottom:18px; }
    input { min-width:0; width:100%; padding:11px 13px; color:var(--text); background:#0d1726; border:1px solid var(--line); border-radius:10px; outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #62b5ff22; }
    .auth-box button { border:0; border-radius:10px; padding:0 18px; color:#061321; background:var(--accent); font-weight:700; cursor:pointer; }
    .auth-box button:hover { filter:brightness(1.1); }
    @keyframes ticker-left { from { transform:translateX(100vw); } to { transform:translateX(-100%); } }
    #status { margin:0 0 16px; color:var(--muted); font-size:.86rem; }
    ul { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
    li { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px 16px; background:var(--card); border:1px solid #ffffff0b; border-radius:13px; }
    .account-name { min-width:0; overflow-wrap:anywhere; color:#c4d0df; font: .82rem ui-monospace,SFMono-Regular,Consolas,monospace; }
    .matched-name { color:var(--accent); font-weight:700; }
    .status-container { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:7px; flex-shrink:0; }
    .badge,.world-info { border-radius:7px; padding:5px 9px; font-size:.75rem; font-weight:700; }
    .badge { color:#fff; }.online { background:#167a4b; }.offline { background:#873241; }
    .world-info { max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#b8e8c4; background:#172f29; border:1px solid #2f604c; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-weight:500; }
    .empty { padding:28px; color:var(--muted); text-align:center; border:1px dashed var(--line); border-radius:13px; }
    .ticker-bar { position:fixed; z-index:10; right:0; bottom:0; left:0; height:48px; display:flex; align-items:center; overflow:hidden; background:#070c15eF; border-top:1px solid var(--line); }
    .ticker-content { width:max-content; padding-left:100vw; white-space:nowrap; animation:ticker-left 20s linear infinite; font:700 .85rem ui-monospace,SFMono-Regular,Consolas,monospace; }.ticker-success{color:#6fe49c}.ticker-error{color:#ff7c89}
    @media (max-width:620px) { body{padding:16px 10px 70px}.container{padding:20px 14px;border-radius:15px}.header{align-items:stretch;flex-direction:column}.admin-header-btn{align-self:flex-end}.auth-box button{padding:0 14px}li{align-items:flex-start;flex-direction:column}.status-container{justify-content:flex-start}.world-info{max-width:100%} }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div><h1>VRChat アカウントステータス</h1><p class="subtitle">アカウントのオンライン状態と公開ロケーションを確認できます。</p></div>
      <button id="admin-btn" class="admin-header-btn" type="button">管理者モード</button>
    </header>
    <div id="admin-banner" class="admin-banner">管理者モード有効中：VRChat取得データを表示しています。</div>
    <div class="auth-box"><input id="name-input" type="text" placeholder="自分のユーザー名を入力"><button id="auth-btn" type="button">決定</button></div>
    <p id="status">ステータスを確認中…</p>
    <ul id="user-list"></ul>
  </main>
  <footer class="ticker-bar"><div id="ticker-text" class="ticker-content ticker-success">STATUS: 初期化中…</div></footer>
  <script>
    const WORKER_URL = "https://tanuinu-accounts-list.hikinikutanuki1.workers.dev";
    const ADMIN_PASS_HASH = "d34f21e44432ff6f781d8476045e7f2776aefb7ccc3fddffe98e9114641a2768";
    let isAdminMode = false;
    const workerStatusData = new Map();

    async function sha256(text) {
      const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buffer)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    function updateTicker(ok, message) {
      const el = document.getElementById("ticker-text");
      el.className = `ticker-content ${ok ? "ticker-success" : "ticker-error"}`;
      el.textContent = `${ok ? "SUCCESS" : "ERROR"}: ${message}`;
    }
    function renderList() {
      const list = document.getElementById("user-list");
      const filter = document.getElementById("name-input").value.trim().toLowerCase();
      list.replaceChildren();
      const rows = [...workerStatusData.entries()].filter(([hash]) => !filter || hash.includes(filter));
      if (!rows.length) { const empty=document.createElement("li"); empty.className="empty"; empty.textContent="表示できるアカウントがありません。"; list.appendChild(empty); return; }
      for (const [hash, account] of rows) {
        const online = account.status !== "offline";
        const showWorld = account.location && (isAdminMode || (filter && !/[~](private|friends|hidden|group)/i.test(account.location) && account.location.startsWith("wrld_")));
        const li=document.createElement("li");
        const name=document.createElement("span"); name.className=filter ? "matched-name" : "account-name"; name.textContent=account.name || hash;
        const status=document.createElement("div"); status.className="status-container";
        const badge=document.createElement("span"); badge.className=`badge ${online ? "online" : "offline"}`; badge.textContent=online ? account.status : "オフライン"; status.appendChild(badge);
        if(showWorld){const world=document.createElement("span");world.className="world-info";world.textContent=account.location;status.appendChild(world)}
        li.append(name,status); list.appendChild(li);
      }
    }
    async function fetchWorkerData() {
      try {
        const response=await fetch(WORKER_URL); if(!response.ok) throw new Error(String(response.status));
        workerStatusData.clear();
        (await response.text()).split("\n").forEach(line=>{const [hash,status,location="",name=""] = line.trim().split(","); if(hash&&status) workerStatusData.set(hash.toLowerCase(),{status:status.toLowerCase(),location,name})});
        const time=new Date().toLocaleTimeString(); document.getElementById("status").textContent=`最終更新: ${time}`; updateTicker(true,`最終更新: ${time}`); renderList();
      } catch(error) { document.getElementById("status").textContent="データの取得に失敗しました。"; updateTicker(false,error.message||"NetworkError"); }
    }
    async function toggleAdmin() {
      if(isAdminMode){isAdminMode=false;document.getElementById("admin-btn").classList.remove("active");document.getElementById("admin-btn").textContent="管理者モード";document.getElementById("admin-banner").style.display="none";renderList();return}
      const password=prompt("管理者パスワードを入力してください:"); if(!password)return;
      if(await sha256(password)===ADMIN_PASS_HASH){isAdminMode=true;document.getElementById("admin-btn").classList.add("active");document.getElementById("admin-btn").textContent="ログアウト";document.getElementById("admin-banner").style.display="block";renderList()}else alert("パスワードが正しくありません。");
    }
    document.getElementById("auth-btn").addEventListener("click",()=>{window.location.hash=encodeURIComponent(document.getElementById("name-input").value.trim());renderList()});
    document.getElementById("name-input").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("auth-btn").click()});
    document.getElementById("admin-btn").addEventListener("click",toggleAdmin);
    window.addEventListener("hashchange",renderList);
    renderList(); fetchWorkerData();
  </script>
</body>
</html>
